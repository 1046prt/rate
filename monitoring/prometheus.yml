global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rate-limiter
    metrics_path: /actuator/prometheus
    # DNS service discovery: follows Docker DNS A records, so each scaled app
    # replica is scraped individually (instance = container IP).
    dns_sd_configs:
      - names: ["app"]
        type: A
        port: 8080
        refresh_interval: 30s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
