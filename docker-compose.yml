services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # Optional Redis AUTH password - if set, configure the same in the redis service
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Required API key. Copy .env.example to .env and set a value.
      # `docker compose up` fails fast if it is missing so the published
      # default can never run with authentication silently disabled.
      - RATELIMITER_API_KEY=${RATELIMITER_API_KEY:?Set RATELIMITER_API_KEY in a .env file (see .env.example)}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: rate-limiter-redis
    # Applies --requirepass only when REDIS_PASSWORD is set (empty = no auth)
    command: ["sh", "-c", "if [ -n \"$${REDIS_PASSWORD}\" ]; then exec redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes --appendfsync everysec; else exec redis-server --appendonly yes --appendfsync everysec; fi"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    # Expose Redis port only internally by default; comment out the next line if you need host access
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG; else redis-cli ping | grep PONG; fi"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
