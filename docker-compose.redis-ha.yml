# Redis high-availability profile: master + replica + Sentinel with automatic failover.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.redis-ha.yml up -d --build
#
# For a full production sentinel quorum (3 sentinels, quorum 2) add:
#   -f docker-compose.sentinel-ha.yml
#
# The app connects through Sentinel (spring.data.redis.sentinel.*) instead of a single host.
# The Sentinel monitors the master by STATIC IP: monitoring by hostname breaks during failover
# because a stopped container's DNS name disappears (same applies in real infra - monitor by IP
# or a stable VIP, never a name that goes away with the node).
#
# NOTE: rate-limit state lives on the Redis primary. AOF persistence (--appendonly yes)
# is enabled on both master and replica and both hold a data volume, so state survives
# restarts; with a warm replica it also survives failover (the promoted node keeps the
# replicated + append-only data). Verify it matches your requirements before relying on it.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  app:
    environment:
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: sentinel:26379

  redis:
    networks:
      default:
        ipv4_address: 172.28.0.10

  redis-replica:
    image: redis:7-alpine
    command: ["sh", "-c", "AUTH_ARGS=\"\"; if [ -n \"$$REDIS_PASSWORD\" ]; then AUTH_ARGS=\"-a $$REDIS_PASSWORD\"; fi; until redis-cli $$AUTH_ARGS -h redis ping | grep -q PONG; do sleep 1; done; REPL_ARGS=\"--appendonly yes --appendfsync everysec --replicaof redis 6379\"; if [ -n \"$$REDIS_PASSWORD\" ]; then REPL_ARGS=\"$$REPL_ARGS --masterauth $$REDIS_PASSWORD\"; fi; exec redis-server $$REPL_ARGS"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis-replica-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -h redis -a \"$$REDIS_PASSWORD\" ping | grep PONG; else redis-cli -h redis ping | grep PONG; fi"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  sentinel:
    image: redis:7-alpine
    command: ["sh", "/sentinel-entrypoint.sh"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SENTINEL_QUORUM=${SENTINEL_QUORUM:-1}
    volumes:
      - ./monitoring/sentinel-entrypoint.sh:/sentinel-entrypoint.sh:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p 26379 sentinel get-master-addr-by-name mymaster | head -1 | grep -q ."]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-replica-data:
