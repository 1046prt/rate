# Alertmanager config template. The docker-compose.monitoring.yml entrypoint
# renders __RECEIVER_URL__ from the RECEIVER_URL env var (see .env.example),
# e.g. a Slack webhook, PagerDuty or Opsgenie URL.
#
# To add more channels, add a receiver (e.g. Slack + email) and route severities
# to different receivers; the `default` receiver must always exist.
route:
  receiver: default
  group_by: ["alertname", "severity", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  continue: false
  routes:
    # Critical alerts page immediately and repeat sooner; warnings are batched.
    - matchers:
        - severity = "critical"
      receiver: default
      group_wait: 10s
      repeat_interval: 1h
      continue: true

inhibit_rules:
  # Don't page for cascading Redis failures while the root cause is already open.
  - source_matchers:
      - alertname = "RedisCircuitBreakerOpen"
    target_matchers:
      - alertname = "RedisFailingOpen"
    equal: ["severity"]

receivers:
  - name: default
    webhook_configs:
      - url: "__RECEIVER_URL__"
        send_resolved: true
